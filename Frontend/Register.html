<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AntiBurnout | Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page register-page">
  <main class="login-shell" aria-label="Registration page">
    <section class="login-card">
      <aside class="visual" aria-label="Brand visual panel">
        <div class="logo-badge">
          <div class="logo-frame" aria-label="AntiBurnout logo">
            <img src="Images/Picture1.png" alt="AntiBurnout logo" />
          </div>
          <a class="back-link" href="index.html">Back to website</a>
        </div>

        <div class="visual-copy">
          <h1>Start steady.<br />Build a better rhythm.</h1>
          <p>A calm, modern workspace for tracking energy, habits, and daily balance.</p>
          <div class="status-dots" aria-hidden="true">
            <span></span>
            <span class="active"></span>
            <span></span>
          </div>
        </div>
      </aside>

      <section class="form-panel" aria-label="Registration form">
        <div>
          <p class="eyebrow">AntiBurnout</p>
          <h2 class="title">Create account</h2>
          <p class="subtitle">Set up your account and start building a healthier relationship with your devices.</p>
        </div>

        <form class="fields" action="#" method="post">
          <div class="field">
            <input type="text" name="name" placeholder="Full name" autocomplete="name" required />
          </div>

          <div class="field">
            <input type="email" name="email" placeholder="Email address" autocomplete="email" required />
          </div>

          <div class="field password">
            <input type="password" name="password" placeholder="Password" autocomplete="new-password" required />
            <span class="eye" aria-hidden="true"></span>
          </div>

          <div class="field password">
            <input type="password" name="passwordConfirmation" placeholder="Confirm password" autocomplete="new-password" required />
            <span class="eye" aria-hidden="true"></span>
          </div>

          <div class="account-prompt">
            <span>Already have an account?</span>
            <a class="account-link" href="Login.html">Log in</a>
          </div>

          <button class="button" type="submit">Create account</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
