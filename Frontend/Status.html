<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status / Anti-Burnout</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', path='Images/Picture1.png') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;1,500;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Anti-Burnout<span>.</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="/#how-it-works">How it works</a>
      <a href="/#for-you">For you</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="ContactUs.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="dashboard-section" aria-labelledby="status-title">
      <div class="section-intro">
        <p class="eyebrow">Connection Status</p>
        <h2 id="status-title">Raspberry Pi<br /><em>Status.</em></h2>
      </div>

      <div class="usage-panel" id="statusCard">
        <div class="panel-topline">
          <span>Sensor Connection</span>
          <span class="status-dot" id="statusDot">Checking...</span>
        </div>
        <div class="usage-notes" style="padding: 30px 0;">
          <h3 id="statusText">Checking...</h3>
          <p id="errorText" style="font-size: 11px; color: #c3bdb4; margin: 0;"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a class="brand" href="/">Anti-Burnout<span>.</span></a>
    <p>Designed for a better relationship with your devices.</p>
    <span>© 2026 TEMPO</span>
  </footer>

  <script>
    async function fetchPiStatus() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const errorText = document.getElementById('errorText');

        if (data.is_connected) {
          statusDot.textContent = "Online";
          statusText.textContent = "Pi is Online";
          errorText.textContent = "";
        } else {
          statusDot.textContent = "Offline";
          statusText.textContent = "Pi is Offline";
          errorText.textContent = data.error_message || "Unknown error";
        }
      } catch (error) {
        document.getElementById('statusDot').textContent = "Offline";
        document.getElementById('statusText').textContent = "Server Unreachable";
        document.getElementById('errorText').textContent = "Cannot connect to the FastAPI backend.";
      }
    }

    setInterval(fetchPiStatus, 2000);
    fetchPiStatus();
  </script>
</body>
</html>
